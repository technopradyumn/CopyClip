name: Flutter CI

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'

      - name: Cache pub packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: L10n drift check
        run: |
          git diff --exit-code lib/src/l10n
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✓ Localization files are up-to-date"
          } else {
            Write-Host "✗ L10n files changed; run 'flutter gen-l10n' and commit"
            exit 1
          }

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests (unit/widget)
        run: flutter test --coverage

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Build iOS (simulator) for sanity check
        run: flutter build ios --no-codesign
        if: runner.os == 'macos-latest'

  lint:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter format check
        run: flutter format --set-exit-if-changed .

      - name: Flutter pub outdated (optional)
        run: flutter pub outdated || true

  release:
    runs-on: macos-latest
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'

      - name: Cache pub packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/copy_clip_release.keystore
        run: |
          if [ ! -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            echo "KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> $GITHUB_ENV
            echo "✓ Keystore decoded successfully"
          else
            echo "⚠ No keystore secret found; build will be unsigned"
          fi

      - name: Build Android release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ ! -z "$KEYSTORE_PATH" ]; then
            flutter build apk --release \
              --dart-define=KEYSTORE_PATH="$KEYSTORE_PATH" \
              --dart-define=KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
              --dart-define=KEY_ALIAS="$ANDROID_KEY_ALIAS" \
              --dart-define=KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          else
            flutter build apk --release
          fi

      - name: Build Android release bundle (AAB)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ ! -z "$KEYSTORE_PATH" ]; then
            flutter build appbundle --release \
              --dart-define=KEYSTORE_PATH="$KEYSTORE_PATH" \
              --dart-define=KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
              --dart-define=KEY_ALIAS="$ANDROID_KEY_ALIAS" \
              --dart-define=KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          else
            flutter build appbundle --release
          fi

      - name: Build iOS release
        run: flutter build ios --release --no-codesign

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            build/app/outputs/apk/release/*.apk
            build/app/outputs/bundle/release/*.aab
            build/ios/iphoneos/Runner.app
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/app/outputs/apk/release/*.apk
            build/app/outputs/bundle/release/*.aab
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
