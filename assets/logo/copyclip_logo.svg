<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#4ECDC4"/>
    </linearGradient>
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F0F0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bgGrad)"/>

  <!-- Clipboard board -->
  <rect x="260" y="260" width="504" height="640" rx="64" fill="url(#clipGrad)" filter="url(#shadow)"/>

  <!-- Clipboard clip -->
  <rect x="400" y="232" width="224" height="80" rx="40" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="440" y="280" width="144" height="32" rx="16" fill="#E0E0E0"/>

  <!-- Document lines -->
  <g fill="#333333" opacity="0.85">
    <rect x="360" y="440" width="200" height="12" rx="6"/>
    <rect x="360" y="472" width="160" height="12" rx="6"/>
    <rect x="360" y="504" width="240" height="12" rx="6"/>
    <rect x="360" y="536" width="140" height="12" rx="6"/>
    <rect x="360" y="568" width="220" height="12" rx="6"/>
    <rect x="360" y="600" width="180" height="12" rx="6"/>
  </g>

  <!-- "CopyClip" accent mark (check + clip) -->
  <path d="M 512 700 L 592 780 L 712 620" stroke="#4ECDC4" stroke-width="40" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
