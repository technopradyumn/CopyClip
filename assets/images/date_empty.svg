<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Sun/Relaxed Atmosphere -->
  <circle cx="160" cy="40" r="15" fill="#FFD54F" fill-opacity="0.8"/>
  <path d="M160 20L160 10M160 70L160 60M180 40L190 40M130 40L140 40" stroke="#FFD54F" stroke-width="2"/>
  
  <!-- Deck Chair -->
  <path d="M40 160L80 120" stroke="#8D6E63" stroke-width="4" stroke-linecap="round"/>
  <path d="M40 120L80 160" stroke="#8D6E63" stroke-width="4" stroke-linecap="round"/>
  <path d="M40 120L140 120" stroke="#FFAB91" stroke-width="4" stroke-linecap="round"/> <!-- Fabric -->
  
  <!-- Body (Lying down) -->
  <path d="M60 115C60 115 80 100 120 100C140 100 150 110 160 115" stroke="#FFE135" stroke-width="30" stroke-linecap="round"/>
  
  <!-- Stem -->
  <path d="M160 115L170 110L175 120" fill="#8B4513"/>
  
  <!-- Face (Sleeping/Relaxed) -->
  <path d="M90 100C95 105 105 105 110 100" stroke="black" stroke-width="2" stroke-linecap="round"/> <!-- Closed eye -->
  <path d="M120 100C125 105 135 105 140 100" stroke="black" stroke-width="2" stroke-linecap="round"/> <!-- Closed eye -->
  <path d="M110 115C115 118 120 118 125 115" stroke="black" stroke-width="2" stroke-linecap="round"/> <!-- Smile -->
  
  <!-- Zzz (Sleep) -->
  <text x="140" y="80" font-family="Arial" font-size="20" fill="#90CAF9">Z</text>
  <text x="155" y="70" font-family="Arial" font-size="15" fill="#90CAF9">z</text>
  <text x="165" y="60" font-family="Arial" font-size="10" fill="#90CAF9">z</text>

  <!-- Drink -->
  <rect x="50" y="140" width="10" height="15" fill="#E1F5FE"/>
  <line x1="55" y1="140" x2="60" y2="130" stroke="#FF4081" stroke-width="1"/> <!-- Straw -->

  <!-- Shadow -->
  <ellipse cx="100" cy="190" rx="60" ry="10" fill="black" fill-opacity="0.1"/>
</svg>
