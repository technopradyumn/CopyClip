  <!-- Body -->
  <path d="M100 170C100 170 60 150 40 90C20 30 60 10 80 10C100 10 140 30 160 90C180 150 140 170 100 170Z" fill="#FFE135"/>
  
  <!-- Stem -->
  <path d="M75 15L85 0L115 0L125 15" fill="#8B4513"/>
  
  <!-- Face (Happy) -->
  <!-- Eyes (Closed Happy) -->
